<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aviso legal · REAMIMA</title>
<meta name="description" content="Aviso legal, política de privacidad y de cookies de REAMIMA TECH, S.L." />
<link rel="stylesheet" href="_design-system.css">
<style>
  .lg-hero { padding-top: clamp(120px, 14vw, 200px); padding-bottom: clamp(48px, 6vw, 80px); }
  .legal-toc {
    border: 1px solid var(--rm-line);
    border-radius: var(--rm-radius-md);
    padding: 24px 28px;
    background: var(--rm-paper);
    margin-bottom: 48px;
  }
  .legal-toc ol { padding-left: 1.4em; margin-top: 12px; }
  .legal-toc li { padding: 4px 0; }
  .legal-toc a { color: var(--rm-navy); text-decoration: none; border-bottom: 1px solid transparent; }
  .legal-toc a:hover { border-bottom-color: var(--rm-navy); }
  .legal-section {
    padding: 36px 0;
    border-top: 1px solid var(--rm-line);
  }
  .legal-section h2 {
    font-family: var(--rm-font-display);
    font-size: clamp(1.4rem, 2vw, 1.8rem);
    font-weight: 300;
    color: var(--rm-navy);
    letter-spacing: -.012em;
    margin: 0 0 .6em 0;
  }
  .legal-section h3 {
    font-family: var(--rm-font-display);
    font-size: 1.05rem;
    font-weight: 500;
    color: var(--rm-navy);
    margin: 1.4em 0 .4em 0;
  }
  .legal-section p, .legal-section li { color: var(--rm-text); }
  .legal-section p + p { margin-top: 1em; }
  .legal-section ul { padding-left: 1.4em; margin-top: .8em; }
  .legal-section li { padding: 4px 0; }
  .legal-section .anchor { display: block; height: 0; visibility: hidden; transform: translateY(-100px); }
  .meta {
    font-family: var(--rm-font-mono);
    font-size: var(--rm-fs-small);
    color: var(--rm-text-muted);
    background: var(--rm-stone);
    padding: 14px 18px;
    border-left: 2px solid var(--rm-navy);
    border-radius: var(--rm-radius-sm);
  }
  .placeholder {
    background: #FFF6E6;
    border-left: 2px solid #C9A97A;
    padding: 14px 18px;
    border-radius: var(--rm-radius-sm);
    font-family: var(--rm-font-mono);
    font-size: var(--rm-fs-small);
    color: #5A4A1F;
  }
</style>
</head>
