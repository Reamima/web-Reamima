<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orígenes · REAMIMA</title>
<meta name="description" content="2020. Confinamiento. REAMIMA diseña un respirador de emergencia con materiales de almacén. Hardware abierto, certificado por OSHWA, presentado en la conferencia global de Arduino." />
<link rel="stylesheet" href="_design-system.css">
<style>
  .or-hero {
    background: linear-gradient(180deg, #050B2C 0%, #0E2483 60%, #0E2483 100%);
    color: #EAEBF0;
    padding-top: clamp(120px, 14vw, 200px);
    padding-bottom: clamp(96px, 10vw, 160px);
    position: relative;
    overflow: hidden;
  }
  .or-hero::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(transparent 95%, rgba(255,255,255,.06) 95%),
      linear-gradient(90deg, transparent 95%, rgba(255,255,255,.06) 95%);
    background-size: 60px 60px;
    pointer-events: none; opacity: .4;
  }
  .or-hero__date { font-family: var(--rm-font-mono); font-size: var(--rm-fs-micro); letter-spacing: .2em; text-transform: uppercase; color: #C0C5DC; }
  .or-hero__title { font-family: var(--rm-font-display); font-weight: 200; font-size: clamp(2.6rem, 6vw, 5.8rem); line-height: 1.02; letter-spacing: -.025em; max-width: 16ch; }
  .or-hero__lead { color: #C0C5DC; max-width: 56ch; margin-top: 2rem; }

  .recognitions {
    display: grid; gap: 24px; grid-template-columns: 1fr;
  }
  @media (min-width: 760px) { .recognitions { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1100px) { .recognitions { grid-template-columns: repeat(4, 1fr); } }
  .rec {
    border: 1px solid var(--rm-line);
    border-radius: var(--rm-radius-md);
    padding: 32px 28px;
    background: var(--rm-paper);
    transition: border-color .25s var(--rm-ease), transform .25s var(--rm-ease);
    display: flex; flex-direction: column; gap: 14px;
    text-decoration: none;
    min-height: 220px;
  }
  .rec:hover { border-color: var(--rm-navy); transform: translateY(-2px); }
  .rec__seal {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--rm-blue-grey);
    color: var(--rm-navy);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--rm-font-mono); font-weight: 500; font-size: 14px;
  }
  .rec__year { font-family: var(--rm-font-mono); font-size: var(--rm-fs-micro); letter-spacing: .14em; color: var(--rm-blue-grey); text-transform: uppercase; }
  .rec__title { font-size: 1.05rem; font-weight: 500; color: var(--rm-text); line-height: 1.3; }
  .rec__source { font-size: var(--rm-fs-small); color: var(--rm-text-muted); margin-top: auto; word-break: break-word; }

  .modelos { display: grid; gap: 28px; grid-template-columns: 1fr; }
  @media (min-width: 880px) { .modelos { grid-template-columns: repeat(3, 1fr); } }
  .modelo {
    background: var(--rm-paper);
    border: 1px solid var(--rm-line);
    border-radius: var(--rm-radius-md);
    padding: 36px 32px;
    transition: border-color .25s var(--rm-ease), transform .25s var(--rm-ease), background .25s var(--rm-ease);
    text-decoration: none; color: inherit;
    display: flex; flex-direction: column;
    min-height: 320px;
  }
  .modelo:hover { border-color: var(--rm-navy); background: #FAFBFE; transform: translateY(-2px); }
  .modelo__num { font-family: var(--rm-font-mono); font-size: var(--rm-fs-micro); letter-spacing: .16em; text-transform: uppercase; color: var(--rm-blue-grey); }
  .modelo__title { font-size: clamp(1.4rem, 2vw, 1.8rem); font-weight: 300; color: var(--rm-navy); margin-top: 14px; letter-spacing: -.012em; }
  .modelo__desc { color: var(--rm-text-muted); margin-top: 16px; }
  .modelo__more { margin-top: auto; padding-top: 24px; color: var(--rm-navy); font-size: var(--rm-fs-small); font-weight: 500; }
  .modelo__more::after { content: " →"; transition: transform .3s var(--rm-ease); display: inline-block; }
  .modelo:hover .modelo__more::after { transform: translateX(3px); }

  .video-frame { aspect-ratio: 16/9; border-radius: var(--rm-radius-lg); overflow: hidden; background: #000; border: 1px solid var(--rm-line); }
  .video-frame iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body data-active-lang="es">
