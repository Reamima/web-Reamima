<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contacta · REAMIMA</title>
<meta name="description" content="Contacta con REAMIMA TECH S.L. — ingeniería, I+D+i, software de alto rendimiento y diseño." />
<link rel="stylesheet" href="_design-system.css">
<style>
  .ct-hero {
    padding-top: clamp(120px, 14vw, 200px);
    padding-bottom: clamp(80px, 9vw, 140px);
  }
  .ct-grid { display: grid; gap: clamp(24px, 4vw, 48px); grid-template-columns: 1fr; }
  @media (min-width: 880px) { .ct-grid { grid-template-columns: 1.1fr .9fr; } }
  .ct-card {
    border: 1px solid var(--rm-line);
    border-radius: var(--rm-radius-md);
    padding: 36px clamp(28px, 3vw, 40px);
    background: var(--rm-paper);
  }
  .ct-row { display: flex; flex-direction: column; gap: 4px; padding: 14px 0; border-bottom: 1px solid var(--rm-line); }
  .ct-row:last-child { border-bottom: 0; }
  .ct-row__label { font-family: var(--rm-font-mono); font-size: var(--rm-fs-micro); letter-spacing: .14em; text-transform: uppercase; color: var(--rm-blue-grey); }
  .ct-row__value { color: var(--rm-text); }
  .ct-row__value a { color: var(--rm-navy); text-decoration: none; border-bottom: 1px solid var(--rm-line); padding-bottom: 1px; }
  .ct-row__value a:hover { border-bottom-color: var(--rm-navy); }
  .ct-channels { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; margin-top: 22px; }
  .channel { border: 1px solid var(--rm-line); border-radius: var(--rm-radius-sm); padding: 18px 16px; text-decoration: none; color: var(--rm-text); transition: border-color .25s var(--rm-ease); }
  .channel:hover { border-color: var(--rm-navy); }
  .channel__title { font-weight: 500; color: var(--rm-navy); }
  .channel__sub { font-family: var(--rm-font-mono); font-size: var(--rm-fs-micro); letter-spacing: .12em; color: var(--rm-blue-grey); text-transform: uppercase; margin-top: 4px; }
</style>
</head>
<body data-active-lang="es">
