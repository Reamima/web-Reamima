<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Modelo Avanzado · Orígenes · REAMIMA</title>
<meta name="description" content="Evolución del Modelo Simple: control de presión, expiración asistida, sensores y monitorización clínica del respirador REAMIMA." />
<link rel="stylesheet" href="_design-system.css">
<style>
  .crumb { font-family: var(--rm-font-mono); font-size: var(--rm-fs-micro); letter-spacing: .14em; text-transform: uppercase; color: var(--rm-blue-grey); }
  .crumb a { color: var(--rm-blue-grey); }
  .crumb a:hover { color: var(--rm-navy); }
  .num-section { display: grid; grid-template-columns: 1fr; gap: 12px; padding: 56px 0; border-top: 1px solid var(--rm-line); }
  @media (min-width: 880px) { .num-section { grid-template-columns: 200px 1fr; gap: 64px; } }
  .num-section__num { font-family: var(--rm-font-mono); font-size: var(--rm-fs-micro); letter-spacing: .16em; text-transform: uppercase; color: var(--rm-blue-grey); }
  .num-section__title { font-size: clamp(1.6rem, 2.4vw, 2.2rem); font-weight: 300; color: var(--rm-navy); letter-spacing: -.012em; line-height: 1.15; margin: 0; }
  .num-section__body { color: var(--rm-text); }
  .num-section__body > * + * { margin-top: 1.2em; }
  .nav-modelos { display: flex; justify-content: space-between; align-items: center; padding: 32px 0; border-top: 1px solid var(--rm-line); }
  .nav-modelos a { font-family: var(--rm-font-mono); font-size: var(--rm-fs-small); letter-spacing: .08em; text-transform: uppercase; color: var(--rm-navy); }
  .feat-grid { display: grid; gap: 22px; grid-template-columns: 1fr; margin-top: 1.6em; }
  @media (min-width: 760px) { .feat-grid { grid-template-columns: 1fr 1fr; } }
  .feat {
    border: 1px solid var(--rm-line);
    border-radius: var(--rm-radius-md);
    padding: 26px 24px;
    background: var(--rm-paper);
  }
  .feat__num { font-family: var(--rm-font-mono); font-size: var(--rm-fs-micro); letter-spacing: .14em; text-transform: uppercase; color: var(--rm-blue-grey); }
  .feat__title { color: var(--rm-navy); font-weight: 500; margin-top: 8px; }
  .feat__body { color: var(--rm-text-muted); margin-top: 8px; font-size: var(--rm-fs-small); }
  .roadmap-status {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--rm-stone); padding: 6px 12px; border-radius: 999px;
    font-family: var(--rm-font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--rm-navy);
  }
  .roadmap-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rm-accent); }
</style>
</head>
<body data-active-lang="es">

<nav class="rm-nav">
  <div class="rm-container rm-nav__inner">
